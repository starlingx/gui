---
- project:
    templates:
      - publish-stx-docs
      - stx-release-notes-jobs
      - stx-bandit-jobs
    check:
      jobs:
        - gui-tox-linters
        - gui-tox-pep8
        - gui-tox-pylint
    gate:
      jobs:
        - gui-tox-linters
        - gui-tox-pep8
        - gui-tox-pylint
    post:
      jobs:
        - stx-gui-upload-git-mirror

- job:
    name: gui-tox-linters
    parent: tox
    description: |
      Run linters
    nodeset: debian-bullseye
    vars:
      tox_envlist: linters

- job:
    name: gui-tox-pep8
    parent: tox
    description: |
      Check conformance with pep8
    nodeset: debian-bullseye
    vars:
      tox_envlist: pep8

- job:
    name: gui-tox-pylint
    parent: tox
    description: Run pylint for gui repo
    nodeset: debian-bullseye
    vars:
      tox_envlist: pylint
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'  # yamllint disable-line rule:line-length
      tox_environment:
        STX_DC_CLIENT: distcloud-client
      bindep_profile: pylint
    required-projects:
      - starlingx/config
      - starlingx/distcloud-client
      - starlingx/fault
      - starlingx/ha
      - starlingx/nfv
      - starlingx/root
      - starlingx/utilities

- job:
    name: stx-gui-upload-git-mirror
    parent: upload-git-mirror
    description: >
      Mirrors opendev.org/starlingx/gui to
      github.com/starlingx/gui
    vars:
      git_mirror_repository: starlingx/gui
    secrets:
      - name: git_mirror_credentials
        secret: stx-gui-github-secret3
        pass-to-parent: true

