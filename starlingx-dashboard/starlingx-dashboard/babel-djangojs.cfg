[javascript: **.js]
# No JSX here (AngularJS/jQuery); Babel's default jsx=True mis-parses '<'/'>'
# and HTML/SVG fragments, silently dropping later gettext() calls. Value must
# be falsy and is passed verbatim, so leave it empty. Do NOT set value to "false" as that verbatim string is truthy.
jsx =

# AngularJS templates live under static/ folders (including plugin panels).
# The custom 'angular' extractor (registered in setup.cfg) reads translate
# filters/directives that the stock extractors cannot.
[angular: **/static/**.html]
