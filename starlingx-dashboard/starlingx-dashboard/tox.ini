[tox]
# No installable sdist; we only run message extraction against the source tree.
envlist = i18n-check,i18n-test
skipsdist = True

# Extraction mirrors upstream Horizon's own i18n tooling: Horizon's
# `manage.py extract_messages` management command (Babel-backed), pointed at
# this plugin's module. It reads [extract_messages] keywords and the
# [babel.extractors] angular extractor from setup.cfg, so gettext_lazy /
# ngettext_lazy plurals and AngularJS templates all extract correctly.
# Settings module is openstack_dashboard.test.settings (same as upstream Horizon),
# provided by the horizon package.
[i18n-base]
setenv =
    DJANGO_SETTINGS_MODULE = openstack_dashboard.test.settings
deps =
    Babel
    Django>=4.2,<4.3
    horizon==25.3.0
    setuptools<81

[testenv:i18n]
# Regenerate the POT templates for both domains (developer convenience).
# The POT is a transient build artifact and is NOT committed to the tree
# (consistent with upstream's --check-only behaviour, which deletes it).
skip_install = True
setenv = {[i18n-base]setenv}
deps = {[i18n-base]deps}
commands =
    {envpython} manage.py extract_messages -m starlingx_dashboard -d django djangojs

[testenv:i18n-check]
# CI gate: extract, verify extraction succeeds, then delete the POT so it does
# not pollute the source tree. This is Horizon's own i18n gate pattern.
skip_install = True
setenv = {[i18n-base]setenv}
deps = {[i18n-base]deps}
commands =
    {envpython} manage.py extract_messages -m starlingx_dashboard -d django djangojs --check-only

[testenv:i18n-test]
# Unit/build-tier lock of the translation mechanism (settings, Debian
# packaging, catalog format, font/UTF-8). Stdlib unittest only; needs
# msgfmt from gettext (bindep.txt provides it in CI).
skip_install = True
allowlist_externals = msgfmt
setenv = STX_I18N_REQUIRE_MSGFMT = 1
deps =
commands =
    {envpython} -m unittest discover -v -s tests -t .
